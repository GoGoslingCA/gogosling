      properties:
        agent_id:
          type: string
        kind:
          type: string
          enum:
            - console
            - telegram
            - feishu
            - dingtalk
            - wecom
            - discord
        name:
          type: string
        secret:
          type: string
          writeOnly: true
          description: Platform credentials such as a Bot Token; written only to secret storage
        config:
          type: object
          additionalProperties: true
        enabled:
          type: boolean
    Event:
      type: object
      required:
        - seq
        - type
        - at
      description: >
        Event envelope. `type` values include:

        - all `model.RunEventType` values (RunEvent payload, including `reasoning.delta`);

        - `session.created` / `session.updated` / `session.deleted` (Session payload);

        - `agent.created` / `agent.updated` / `agent.deleted` (Agent payload; agent deletion cascades to sessions, jobs,
        and channels, so clients must invalidate related caches);

        - `provider.created` / `provider.updated` / `provider.deleted` (Provider payload without credentials);

        - `job.triggered` (Job payload);

        - `extension.installed` / `extension.updated` / `extension.removed` / `extension.tools_changed` (Extension
        payload);

        - `project.created/updated`, `project.material.created/removed`, `draft.updated/deleted`, and
        `artifact.created/revision.created` (only IDs, versions, and source metadata; no body text);

        - `worker.status` (VersionInfo.worker payload) and `gap` (no payload).

        Only add event types; preserve existing field semantics.
      properties:
        seq:
          type: integer
          format: int64
        type:
          type: string
        at:
          type: string
          format: date-time
        agent_id:
          type: string
        session_id:
          type: string
        run_id:
          type: string
        payload:
          type: object
          additionalProperties: true
    Settings:
      type: object
      properties:
        timezone:
          type: string
          description: IANA timezone; omitted when unset. effective_timezone reports the active value
        locale:
          type: string
          enum:
            - zh
            - en
            - fr
          description: Explicit user language preference; omitted when unset so the client can follow browser/system language
        effective_locale:
          type: string
          enum:
            - zh
            - en
            - fr
          readOnly: true
          description: "Active daemon language: setting, then system environment, then default"
        effective_timezone:
          type: string
          readOnly: true
          description: Active daemon timezone
        allowed_origins:
          type: array
          items:
            type: string
          description: Additional allowed Origins for development
    AuditEntry:
      type: object
      required:
        - id
        - at
        - actor
        - action
        - outcome
      properties:
        id:
