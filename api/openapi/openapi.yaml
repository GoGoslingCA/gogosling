openapi: 3.1.0
info:
  title: gogosling 本地 API
  version: "1"
  description: |
    守护进程 `gogoslingd` 提供给桌面壳、Web UI、CLI 的本地接口。

    **安全约定**
    - 只监听回环地址；除 `/healthz` 外所有路径都需要 `Authorization: Bearer <token>`，令牌来自数据目录下的 `daemon.json`。
    - 服务端校验 `Host`（必须是 `127.0.0.1` / `localhost` 加端口）与 `Origin`（无 Origin、`app://gogosling`、或配置的开发源）。
    - 错误统一返回 `ErrorResponse`，`code` 与 `internal/model.Code` 一致；`message` 已按 `Accept-Language` 本地化。
    - 列表接口返回 `{"items": [...]}`；分页用 `limit` / `offset` 查询参数。
    - 所有时间为 RFC 3339（UTC）。字段命名 `snake_case`。
servers:
  - url: http://127.0.0.1:46750
security:
  - bearer: []
tags:
  - name: system
  - name: agents
  - name: providers
  - name: sessions
  - name: runs
  - name: approvals
  - name: jobs
  - name: extensions
  - name: channels
  - name: events
  - name: settings
  - name: audit
  - name: workbench

paths:
  /healthz:
    get:
      tags: [system]
      summary: 存活检查（免鉴权）
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, const: ok } }

  /api/v1/version:
    get:
      tags: [system]
      summary: 版本与运行状态
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }

  /api/v1/system/shutdown:
    post:
      tags: [system]
      summary: 优雅关闭守护进程（经鉴权；返回 202 后开始关闭）
      description: |
        桌面壳与 CLI 优先用它停止守护进程（Windows 上没有可用的信号途径），超时后才强制结束进程。
        关闭完成后 daemon.json 与 daemon.lock 被删除。
      responses:
        "202": { description: 已开始关闭 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/agents:
    get:
      tags: [agents]
      summary: 列出智能体
      responses:
        "200": { $ref: "#/components/responses/AgentList" }
    post:
      tags: [agents]
      summary: 创建智能体
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentInput" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/agents/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [agents]
      summary: 获取智能体
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } } }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [agents]
      summary: 更新智能体（部分字段）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentInput" }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Agent" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [agents]
      summary: 删除智能体（级联删除其会话；工作区文件保留）
      responses:
        "204": { description: 已删除 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/agents/{id}/tools:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [agents]
      summary: 该智能体当前可用的工具声明（内置 + 已启用扩展）
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ToolSpec" } }

  /api/v1/providers:
    get:
      tags: [providers]
      summary: 列出供应商（不含密钥）
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Provider" } }
    post:
      tags: [providers]
      summary: 创建供应商；`api_key` 只写入 secret 存储，响应中不回显
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
      responses:
        "201": { description: 已创建, content: { application/json: { schema: { $ref: "#/components/schemas/Provider" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/providers/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [providers]
      summary: 获取供应商
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Provider" } } } }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [providers]
      summary: 更新供应商；传 `api_key` 则轮换密钥
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Provider" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [providers]
      summary: 删除供应商（仍被智能体引用时返回 conflict）
      responses:
        "204": { description: 已删除 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/providers/{id}/test:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [providers]
      summary: 连通性测试；成功时刷新 `models` 列表
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  models: { type: array, items: { type: string } }
                  latency_ms: { type: integer }
                  error: { type: string }

  /api/v1/sessions:
    get:
      tags: [sessions]
      summary: 列出会话
      parameters:
        - { name: project_id, in: query, schema: { type: string } }
        - { name: agent_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/SessionStatus" } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/offset" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Session" } }
    post:
      tags: [sessions]
      summary: 创建会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id: { type: string }
                project_id: { type: string }
                title: { type: string }
                origin: { type: string, enum: [desktop, cli], default: desktop, description: 发起入口，决定会话键与界面标记 }
      responses:
        "201": { description: 已创建, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/sessions/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [sessions]
      summary: 获取会话
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [sessions]
      summary: 重命名或归档
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                status: { $ref: "#/components/schemas/SessionStatus" }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [sessions]
      summary: 删除会话及其消息与运行记录
      responses:
        "204": { description: 已删除 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/sessions/{id}/messages:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [sessions]
      summary: 读取消息（按 seq 升序；limit 上限 500，与通用分页一致）
      parameters:
        - { name: after_seq, in: query, schema: { type: integer, default: 0 } }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Message" } }
    post:
      tags: [sessions]
      summary: 发送用户消息并发起一次运行
      description: |
        立即返回新建的 `Run`（状态 queued/running）。过程事件通过 `/api/v1/events` 流式获取。
        同一会话已有未结束的运行时返回 `conflict`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                material_ids: { type: array, maxItems: 32, items: { type: string }, description: 明确选择同一项目资料；逐份校验归属、文件大小及SHA256，任一无效则拒绝整次发送 }
                attachments:
                  type: array
                  items: { $ref: "#/components/schemas/Attachment" }
      responses:
        "202": { description: 运行已受理, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/sessions/{id}/attachments:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [sessions]
      summary: 上传附件到工作区 inbound/ 目录
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "201": { description: 已上传, content: { application/json: { schema: { $ref: "#/components/schemas/Attachment" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/runs/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [runs]
      summary: 获取运行
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/runs/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [runs]
      summary: 取消运行（幂等；已终态时返回当前状态）
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/approvals:
    get:
      tags: [approvals]
      summary: 列出审批请求
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ApprovalStatus", default: pending } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/offset" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ApprovalRequest" } }

  /api/v1/approvals/{id}/decision:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [approvals]
      summary: 提交审批决定
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Decision" }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalRequest" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/jobs:
    get:
      tags: [jobs]
      summary: 列出定时任务
      parameters:
        - { name: agent_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Job" } }
    post:
      tags: [jobs]
      summary: 创建定时任务
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobInput" }
      responses:
        "201": { description: 已创建, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/jobs/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [jobs]
      summary: 获取定时任务
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [jobs]
      summary: 更新定时任务
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobInput" }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [jobs]
      summary: 删除定时任务
      responses:
        "204": { description: 已删除 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/jobs/{id}/run:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [jobs]
      summary: 立即触发一次
      responses:
        "202": { description: 已触发 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/extensions:
    get:
      tags: [extensions]
      summary: 列出扩展
      parameters:
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/ExtensionKind" } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Extension" } }
    post:
      tags: [extensions]
      summary: 从本地目录安装扩展，或注册一个 MCP 服务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path: { type: string, description: 本地目录（技能或插件） }
                mcp:
                  allOf:
                    - { $ref: "#/components/schemas/MCPServerConfig" }
                  description: 注册 MCP 服务时提供
                name: { type: string, description: MCP 服务的显示名 }
      responses:
        "201": { description: 已安装, content: { application/json: { schema: { $ref: "#/components/schemas/Extension" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/extensions/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [extensions]
      summary: 获取扩展
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Extension" } } } }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [extensions]
      summary: 启用或停用
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Extension" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [extensions]
      summary: 卸载
      responses:
        "204": { description: 已卸载 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/extensions/{id}/status:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [extensions]
      summary: 扩展运行时状态
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ExtensionStatus" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/extensions/{id}/accept-tools:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [extensions]
      summary: 确认并重新固定该扩展的工具声明（tools_changed 后调用）
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ExtensionStatus" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/channels:
    get:
      tags: [channels]
      summary: 列出 IM 通道
      parameters:
        - { name: agent_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Channel" } }
    post:
      tags: [channels]
      summary: 创建通道；`secret` 只写入 secret 存储，响应中不回显
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelInput" }
      responses:
        "201": { description: 已创建, content: { application/json: { schema: { $ref: "#/components/schemas/Channel" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/channels/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [channels]
      summary: 获取通道（含运行状态）
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Channel" } } } }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [channels]
      summary: 更新通道；传 `secret` 则轮换凭据；修改后自动重载
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelInput" }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Channel" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [channels]
      summary: 删除通道并停止适配器
      responses:
        "204": { description: 已删除 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/channels/{id}/reload:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [channels]
      summary: 重启该通道的适配器
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Channel" } } } }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/events:
    get:
      tags: [events]
      summary: 事件流（Server-Sent Events）
      description: |
        `text/event-stream`。连接建立后的第一帧是 `event: hello`（无 `id`，`data` 为 `{"started_at","last_seq"}`）：
        客户端若发现 `started_at` 与上次不同（守护进程已重启），必须丢弃本地 `since` 并全量刷新。
        之后每条事件：`id` 为全局 Seq，`event` 为类型，`data` 为 `Event` JSON。
        客户端带 `since`（或 `Last-Event-ID` 头）续传；若服务端缓冲已丢弃该位置之后的事件，或 `since` 超过当前 Seq，
        先发送一条 `event: gap` 让客户端全量刷新。每 15 秒发送一条注释行保活。
      parameters:
        - { name: since, in: query, schema: { type: integer, format: int64, default: 0 } }
        - { name: session_id, in: query, schema: { type: string }, description: 只订阅某个会话 }
      responses:
        "200":
          description: 事件流
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/Event" }

  /api/v1/agents/{id}/prompt-enhancement:
    post:
      tags: [agents]
      summary: 优化输入文字并返回待用户应用的候选
      description: 需要 prompt.enhance 能力。使用当前智能体模型，仅传输入文字，无工具、历史或持久消息。共享并发预算，全局最多一个优化请求；断开/取消终止推理，最长45秒。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: { type: string, minLength: 1, description: UTF-8最多16000字节，不截断 }
                draft: { type: string, description: 可选的当前候选，最多32000字节；与feedback成对提供 }
                feedback: { type: string, description: 可选的修改意见，最多4000字节 }
      responses:
        "200":
          description: 优化文字；未应用、未发送。不含内部指导词。
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text: { type: string, description: 完整候选，UTF-8最多32000字节 }
        default: { $ref: "#/components/responses/Error" }

  /api/v1/resources:
    get:
      tags: [settings]
      summary: 本地执行槽与排队状态
      description: 仅 runtime.resources 能力启用时可用。等待审批计入执行槽，不代表 CPU 使用率。
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/ResourceState" } } } }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [settings]
      summary: 保存并发上限并作用于后续派发
      description: 降低上限不停止在途任务；运行数可能暂时高于新上限。
      requestBody:
        required: true
        content:
          application/json:
            schema:
