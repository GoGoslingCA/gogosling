openapi: 3.1.0
info:
  title: gogosling Local API
  version: "1"
  description: >
    The `gogoslingd` daemon provides local interfaces for the desktop shell, Web UI, and CLI.


    **Security contract**

    - Listen only on loopback addresses. Every path except `/healthz` requires `Authorization: Bearer <token>`; the
    token comes from `daemon.json` in the data directory.

    - Validate `Host` (`127.0.0.1` or `localhost` with a port) and `Origin` (absent, `app://gogosling`, or a configured
    development origin).

    - Return errors as `ErrorResponse`; `code` matches `internal/model.Code`, and `message` is localized using
    `Accept-Language`.

    - List endpoints return `{"items": [...]}` and use `limit` / `offset` for pagination.

    - All times use RFC 3339 (UTC). Field names use `snake_case`.
servers:
  - url: http://127.0.0.1:46750
security:
  - bearer: []
tags:
  - name: system
  - name: agents
  - name: providers
  - name: sessions
  - name: runs
  - name: approvals
  - name: jobs
  - name: extensions
  - name: channels
  - name: events
  - name: settings
  - name: audit
  - name: workbench
paths:
  /healthz:
    get:
      tags:
        - system
      summary: Liveness check (no authentication required)
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
  /api/v1/version:
    get:
      tags:
        - system
      summary: Version and runtime status
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
  /api/v1/system/shutdown:
    post:
      tags:
        - system
      summary: Gracefully shut down the daemon (authenticated; shutdown begins after returning 202)
      description: >
        The desktop shell and CLI use this endpoint to stop the daemon before attempting forced termination after a
        timeout; Windows has no suitable signal path.

        After shutdown completes, daemon.json and daemon.lock are removed.
      responses:
        "202":
          description: Shutdown started
        default:
          $ref: "#/components/responses/Error"
  /api/v1/agents:
    get:
      tags:
        - agents
      summary: List agents
      responses:
        "200":
          $ref: "#/components/responses/AgentList"
    post:
      tags:
        - agents
      summary: Create an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/agents/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags:
        - agents
      summary: Get an agent
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - agents
      summary: Update selected agent fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - agents
      summary: Delete an agent and its sessions; retain workspace files
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /api/v1/agents/{id}/tools:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags:
        - agents
      summary: Tool declarations currently available to this agent (built-in tools and enabled extensions)
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ToolSpec"
  /api/v1/providers:
    get:
      tags:
        - providers
      summary: List providers without credentials
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Provider"
    post:
      tags:
        - providers
      summary: Create a provider; write `api_key` only to secret storage and never echo it in the response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/providers/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags:
        - providers
      summary: Get a provider
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - providers
      summary: Update a provider; supplying `api_key` rotates the credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderInput"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - providers
      summary: Delete a provider; return conflict while an agent still references it
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /api/v1/providers/{id}/test:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags:
        - providers
      summary: Test connectivity; refresh the `models` list on success
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  models:
                    type: array
                    items:
                      type: string
                  latency_ms:
                    type: integer
                  error:
                    type: string
  /api/v1/sessions:
    get:
      tags:
        - sessions
      summary: List sessions
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
        - name: agent_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/SessionStatus"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
    post:
      tags:
        - sessions
      summary: Create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - agent_id
              properties:
                agent_id:
                  type: string
                project_id:
                  type: string
                title:
                  type: string
                origin:
                  type: string
                  enum:
                    - desktop
                    - cli
                  default: desktop
                  description: Initiating entry point, which determines the session key and UI marker
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags:
        - sessions
      summary: Get a session
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - sessions
      summary: Rename or archive a session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                status:
                  $ref: "#/components/schemas/SessionStatus"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - sessions
      summary: Delete a session, its messages, and its runs
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /api/v1/sessions/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags:
        - sessions
      summary: Read messages in ascending seq order; limit is capped at 500, matching general pagination
      parameters:
        - name: after_seq
          in: query
          schema:
            type: integer
            default: 0
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
    post:
      tags:
        - sessions
      summary: Send a user message and start a run
      description: |
        Immediately return the new `Run` with queued/running status. Receive progress through `/api/v1/events`.
        Return `conflict` if the same session already has an unfinished run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                material_ids:
                  type: array
                  maxItems: 32
                  items:
                    type: string
                  description: >-
                    Explicitly select materials from the same project. Verify ownership, file size, and SHA256 for each;
                    reject the entire send if any item is invalid
                attachments:
                  type: array
                  items:
                    $ref: "#/components/schemas/Attachment"
      responses:
        "202":
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/sessions/{id}/attachments:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags:
        - sessions
      summary: Upload an attachment to the workspace inbound/ directory
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/runs/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags:
        - runs
      summary: Get a run
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/runs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags:
        - runs
      summary: Cancel a run idempotently; return its current status if already terminal
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/approvals:
    get:
      tags:
        - approvals
      summary: List approval requests
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ApprovalStatus"
            default: pending
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApprovalRequest"
  /api/v1/approvals/{id}/decision:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags:
        - approvals
      summary: Submit an approval decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Decision"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequest"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/jobs:
    get:
      tags:
        - jobs
      summary: List scheduled jobs
      parameters:
        - name: agent_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
    post:
      tags:
        - jobs
      summary: Create a scheduled job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags:
        - jobs
      summary: Get a scheduled job
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - jobs
      summary: Update a scheduled job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - jobs
      summary: Delete a scheduled job
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /api/v1/jobs/{id}/run:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags:
        - jobs
      summary: Trigger a job immediately
      responses:
        "202":
          description: Triggered
        default:
          $ref: "#/components/responses/Error"
  /api/v1/extensions:
    get:
      tags:
        - extensions
      summary: List extensions
      parameters:
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/ExtensionKind"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Extension"
    post:
      tags:
        - extensions
      summary: Install an extension from a local directory or register an MCP server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: Local directory containing a skill or plugin
                mcp:
                  allOf:
                    - $ref: "#/components/schemas/MCPServerConfig"
                  description: Supplied when registering an MCP server
                name:
                  type: string
                  description: MCP server display name
      responses:
        "201":
          description: Installed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Extension"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/extensions/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags:
        - extensions
      summary: Get an extension
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Extension"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - extensions
      summary: Enable or disable an extension
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Extension"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - extensions
      summary: Uninstall an extension
      responses:
        "204":
          description: Uninstalled
        default:
          $ref: "#/components/responses/Error"
  /api/v1/extensions/{id}/status:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags:
        - extensions
      summary: Extension runtime status
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionStatus"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/extensions/{id}/accept-tools:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags:
        - extensions
      summary: Confirm and pin the extension tool declarations again after tools_changed
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionStatus"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/channels:
    get:
      tags:
        - channels
      summary: List IM channels
      parameters:
        - name: agent_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Channel"
    post:
      tags:
        - channels
      summary: Create a channel; write `secret` only to secret storage and never echo it in the response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/channels/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags:
        - channels
      summary: Get a channel including runtime status
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - channels
      summary: Update a channel; supplying `secret` rotates credentials, and changes automatically reload the adapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelInput"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - channels
      summary: Delete a channel and stop its adapter
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /api/v1/channels/{id}/reload:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags:
        - channels
      summary: Restart the channel adapter
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/events:
    get:
      tags:
        - events
      summary: Event stream (Server-Sent Events)
      description: >
        `text/event-stream`. The first frame after connection is `event: hello`, without `id`, with `data` containing
        `{"started_at","last_seq"}`.

        If `started_at` differs from the previous connection, the daemon has restarted: discard the local `since` value
        and refresh all state.

        For subsequent events, `id` is the global Seq, `event` is the type, and `data` is `Event` JSON.

        Resume using `since` or the `Last-Event-ID` header. If the server buffer no longer contains the requested
        position, or `since` exceeds the current Seq, first send `event: gap` so the client refreshes all state.

        Send a comment line every 15 seconds as a keepalive.
      parameters:
        - name: since
          in: query
          schema:
            type: integer
            format: int64
            default: 0
        - name: session_id
          in: query
          schema:
            type: string
          description: Subscribe only to a specific session
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/Event"
  /api/v1/agents/{id}/prompt-enhancement:
    post:
      tags:
        - agents
      summary: Return enhanced input text without sending a chat message
      description: >-
        Requires prompt.enhance. Use the current agent model with input text only: no tools, history, or persisted
        messages. Share the concurrency budget and allow at most one enhancement request globally. Disconnect/cancel
        stops inference; maximum duration is 45 seconds.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - text
              properties:
                text:
                  type: string
                  minLength: 1
                  description: UTF-8 input, maximum 16000 bytes; never truncate
                draft:
                  type: string
                  description: Optional current candidate, maximum 32000 bytes; supply together with feedback
                feedback:
                  type: string
                  description: Optional revision feedback, maximum 4000 bytes
      responses:
        "200":
          description: Enhanced text for the client to display in the input; no chat message is sent; excludes internal instructions
          content:
            application/json:
              schema:
                type: object
                required:
                  - text
                properties:
                  text:
                    type: string
                    description: Complete UTF-8 candidate, maximum 32000 bytes
        default:
          $ref: "#/components/responses/Error"
  /api/v1/resources:
    get:
      tags:
        - settings
      summary: Local execution slots and queue status
      description: >-
        Available only when runtime.resources is enabled. Awaiting approval occupies an execution slot; this is not CPU
        utilization.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceState"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags:
        - settings
      summary: Save the parallelism limit and use it for subsequent dispatch
      description: Lowering the limit does not stop in-flight tasks; the running count may temporarily exceed the new limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - max_parallel
              properties:
                max_parallel:
                  type: integer
                  minimum: 1
                  maximum: 8
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceState"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/settings:
    get:
      tags:
        - settings
      summary: Global settings
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      tags:
        - settings
      summary: Update global settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/audit:
    get:
      tags:
        - audit
      summary: Audit records in descending time order
      parameters:
        - name: agent_id
          in: query
          schema:
            type: string
        - name: session_id
          in: query
          schema:
            type: string
        - name: run_id
          in: query
          schema:
            type: string
        - name: actor
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
  /api/v1/projects:
    get:
      tags:
        - workbench
      summary: List projects
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
                required:
                  - items
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - name: agent_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - archived
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
    post:
      tags:
        - workbench
      summary: Create a project under the same agent
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
  /api/v1/projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      tags:
        - workbench
      summary: Get a project
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - workbench
      summary: Update or archive a project using a version condition
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPatch"
  /api/v1/projects/{id}/materials:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      tags:
        - workbench
      summary: List explicitly uploaded project materials
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectMaterial"
                required:
                  - items
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
    post:
      tags:
        - workbench
      summary: Create an inbound attachment and a project-material index entry
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMaterial"
        default:
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
  /api/v1/projects/{id}/materials/{material_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: material_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    delete:
      tags:
        - workbench
      summary: Remove only the material index; retain the file and messages
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Error"
  /api/v1/sessions/{id}/project:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    put:
      tags:
        - workbench
      summary: Validate the previous project association, then update it atomically
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionProjectInput"
  /api/v1/drafts:
    get:
      tags:
        - workbench
      summary: Read drafts belonging to the current authenticated principal
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Draft"
                required:
                  - items
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - name: kind
          in: query
          schema:
            type: string
        - name: agent_id
          in: query
          schema:
            type: string
        - name: project_id
          in: query
          schema:
            type: string
        - name: session_id
          in: query
          schema:
            type: string
        - name: artifact_id
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
    post:
      tags:
        - workbench
      summary: Create a unique draft scope; return 409 and existing_draft_id when the scope already exists
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        default:
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftInput"
  /api/v1/drafts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      tags:
        - workbench
      summary: Read a draft by principal
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags:
        - workbench
      summary: Replace a draft completely using the expected_version condition
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        default:
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftUpdateInput"
    delete:
      tags:
        - workbench
      summary: Delete only a principal-owned draft with a matching version
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - name: expected_version
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
          required: true
  /api/v1/sessions/{id}/artifacts:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      tags:
        - workbench
      summary: List saved artifact metadata for the current session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Artifact"
                required:
                  - items
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
    post:
      tags:
        - workbench
      summary: Create an artifact and initial revision from a real assistant reply in the current session
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        default:
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactInput"
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            maxLength: 128
          description: >-
            A retry by the same principal with the same path and content returns the existing resource; reusing the key
            with different content returns 409.
  /api/v1/projects/{id}/artifacts:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      tags:
        - workbench
      summary: Aggregate artifacts by the current project associations of their sessions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Artifact"
                required:
                  - items
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
  /api/v1/artifacts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      tags:
        - workbench
      summary: Read artifact metadata without body text
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/artifacts/{id}/revisions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      tags:
        - workbench
      summary: List immutable revision metadata without body text
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ArtifactRevision"
                required:
                  - items
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
    post:
      tags:
        - workbench
      summary: Append a revision only when its baseline matches; do not overwrite an earlier revision
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactRevision"
        default:
          $ref: "#/components/responses/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactRevisionInput"
  /api/v1/artifacts/{id}/revisions/{revision_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: revision_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      tags:
        - workbench
      summary: Read revision metadata belonging to the specified artifact
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactRevision"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/artifacts/{id}/revisions/{revision_id}/content:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: revision_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      tags:
        - workbench
      summary: Authenticated UTF-8 body read; no-store, nosniff, and forced attachment for downloads
      responses:
        "200":
          description: Original revision body with unchanged byte count and digest; range downloads are not supported.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            text/plain:
              schema:
                type: string
                format: text
        default:
          $ref: "#/components/responses/Error"
  /api/v1/artifacts/{id}/revisions/{revision_id}/download:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: revision_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      tags:
        - workbench
      summary: Authenticated UTF-8 body read; no-store, nosniff, and forced attachment for downloads
      responses:
        "200":
          description: Original revision body with unchanged byte count and digest; range downloads are not supported.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /api/v1/sessions/{id}/changesets:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags:
        - workbench
      summary: List file changes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChangeSet"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags:
        - workbench
      summary: Freeze a single-file preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeInput"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeSet"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/changesets/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags:
        - workbench
      summary: Read change state
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeSet"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/changesets/{id}/diff:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags:
        - workbench
      summary: Read authenticated frozen before/after text
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeDiff"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/changesets/{id}/apply:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags:
        - workbench
      summary: Request application of a frozen file change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeApplyInput"
      responses:
        "202":
          description: Accepted; inspect the final change state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeSet"
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 160
  /api/v1/changesets/{id}/undo-preview:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags:
        - workbench
      summary: Prepare an independent undo preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeVersionInput"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeSet"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/changesets/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags:
        - workbench
      summary: Cancel a pending file change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeVersionInput"
      responses:
        "202":
          description: Accepted; inspect the final change state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeSet"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/changesets/{id}/reconcile:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags:
        - workbench
      summary: Verify and recover an uncertain file change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeVersionInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeSet"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/agents/{id}/files:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags:
        - agents
      summary: List workspace files with bounded results
      parameters:
        - name: path
          in: query
          schema:
            type: string
      responses:
        "200":
          description: File entries and truncated flag
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - truncated
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PreviewFileEntry"
                  truncated:
                    type: boolean
        default:
          $ref: "#/components/responses/Error"
  /api/v1/agents/{id}/file-preview:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags:
        - agents
      summary: Read-only bounded content preview
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Content representation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewDocument"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/agents/{id}/file-content:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags:
        - agents
      summary: Authenticated original file with Range support, max 64 MiB
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: version
          in: query
          schema:
            type: string
        - name: Range
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Original file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Requested byte range
        "416":
          description: Invalid range
        default:
          $ref: "#/components/responses/Error"
  /api/v1/agents/{id}/file-layout:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags:
        - agents
      summary: Convert an Office file to PDF in an optional local sandbox, with one process and a 30-second timeout
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: version
          in: query
          schema:
            type: string
      responses:
        "200":
          description: PDF layout
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AgentList:
      description: ok
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
  schemas:
    PreviewFileEntry:
      type: object
      required:
        - name
        - path
        - size
        - is_dir
        - mod_time
      properties:
        name:
          type: string
        path:
          type: string
        size:
          type: integer
        is_dir:
          type: boolean
        mod_time:
          type: string
          format: date-time
    PreviewBlock:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - paragraph
            - heading
            - table
            - image
        text:
          type: string
        level:
          type: integer
        image:
          type: string
          description: Validated embedded raster data URL
        runs:
          type: array
          items:
            type: object
            required:
              - text
            properties:
              text:
                type: string
              bold:
                type: boolean
              italic:
                type: boolean
        rows:
          type: array
          items:
            type: array
            items:
              type: string
    PreviewDocument:
      type: object
      required:
        - format
        - kind
        - name
        - size
        - mime
        - version
      properties:
        format:
          type: string
        kind:
          type: string
          enum:
            - text
            - markdown
            - html
            - document
            - slides
            - sheet
            - archive
            - pdf
            - image
            - audio
            - video
            - conversion
            - unsupported
        name:
          type: string
        size:
          type: integer
        mime:
          type: string
        version:
          type: string
        text:
          type: string
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/PreviewBlock"
        warnings:
          type: array
          items:
            type: string
        slides:
          type: array
          items:
            type: object
            required:
              - name
              - blocks
            properties:
              name:
                type: string
              blocks:
                type: array
                items:
                  $ref: "#/components/schemas/PreviewBlock"
        sheets:
          type: array
          items:
            type: object
            required:
              - name
              - rows
            properties:
              name:
                type: string
              rows:
                type: array
                items:
                  type: array
                  items:
                    type: string
        entries:
          type: array
          items:
            type: object
            required:
              - name
              - size
              - directory
            properties:
              name:
                type: string
              size:
                type: integer
              directory:
                type: boolean
    ChangeSet:
      type: object
      description: Metadata only; file identities, before-images and proposed text stay in protected daemon storage.
      required:
        - id
        - owner_id
        - agent_id
        - session_id
        - artifact_id
        - revision_id
        - target_path
        - preview_digest
        - base_sha256
        - proposed_sha256
        - operation
        - status
        - version
        - base_exists
        - proposed_size
        - created_at
        - expires_at
      properties:
        id:
          type: string
        owner_id:
          type: string
        agent_id:
          type: string
        session_id:
          type: string
