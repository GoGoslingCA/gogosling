        updated_at: { type: string, format: date-time }
        last_message_at: { type: string, format: date-time }

    Attachment:
      type: object
      required: [name, path, size]
      properties:
        name: { type: string }
        path: { type: string, description: 工作区相对路径 }
        mime: { type: string }
        size: { type: integer, format: int64 }

    ToolCall:
      type: object
      required: [id, name, arguments]
      properties:
        id: { type: string }
        name: { type: string }
        arguments: { type: object, additionalProperties: true }

    ToolResult:
      type: object
      required: [call_id, content]
      properties:
        call_id: { type: string }
        content: { type: string }
        is_error: { type: boolean }
        truncated: { type: boolean }

    Part:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [text, tool_call, tool_result, attachment] }
        text: { type: string }
        tool_call: { $ref: "#/components/schemas/ToolCall" }
        tool_result: { $ref: "#/components/schemas/ToolResult" }
        attachment: { $ref: "#/components/schemas/Attachment" }

    Message:
      type: object
      required: [id, session_id, seq, role, parts, created_at]
      properties:
        id: { type: string }
        session_id: { type: string }
        seq: { type: integer, format: int64 }
        role: { type: string, enum: [system, user, assistant, tool] }
        run_id: { type: string }
        parts: { type: array, items: { $ref: "#/components/schemas/Part" } }
        meta:
          type: object
          additionalProperties: true
          description: 已知键：partial(bool，失败/取消时的部分输出)、untrusted(bool，来自不可信来源)
        created_at: { type: string, format: date-time }

    Usage:
      type: object
      properties:
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cache_read_tokens: { type: integer, format: int64 }
        cache_write_tokens: { type: integer, format: int64 }

    Run:
      type: object
      required: [id, session_id, agent_id, status, trigger, usage, created_at]
      properties:
        id: { type: string }
        session_id: { type: string }
        agent_id: { type: string }
        status: { type: string, enum: [queued, running, awaiting_approval, completed, failed, cancelled] }
        trigger: { type: string, enum: [user, job, channel, agent] }
        input_message_id: { type: string }
        output_message_id: { type: string }
        error: { type: string }
        usage: { $ref: "#/components/schemas/Usage" }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }

    ToolSpec:
      type: object
      required: [name, description, input_schema, source, risk]
      properties:
        name: { type: string }
        description: { type: string }
        input_schema: { type: object, additionalProperties: true }
        source: { type: string, description: builtin / mcp:<extension_id> / extension:<extension_id> }
        risk: { type: string, enum: [read, write, execute, network, destructive] }

    ApprovalStatus:
      type: string
      enum: [pending, approved, denied, expired]

    ApprovalRequest:
      type: object
      required: [id, session_id, agent_id, tool_call, risk, summary, status, created_at, expires_at]
      oneOf:
        - required: [run_id]
          not: { required: [operation_id] }
        - required: [operation_id]
          not: { required: [run_id] }
      properties:
        id: { type: string }
        run_id: { type: string }
        operation_id: { type: string, description: "Only one-time approval is valid for manual operations." }
        session_id: { type: string }
        agent_id: { type: string }
        tool_call: { $ref: "#/components/schemas/ToolCall" }
        risk: { type: string, enum: [read, write, execute, network, destructive] }
        summary: { type: string }
        details: { type: object, additionalProperties: true }
        status: { $ref: "#/components/schemas/ApprovalStatus" }
        scope: { type: string, enum: [once, session, always] }
        decided_by: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }

    Decision:
      type: object
      required: [approve]
      properties:
        approve: { type: boolean }
        scope: { type: string, enum: [once, session, always], default: once }
        reason: { type: string }

    Job:
      type: object
      required: [id, agent_id, name, schedule, kind, input, missed_policy, enabled, created_at, updated_at]
      properties:
        id: { type: string }
        agent_id: { type: string }
        name: { type: string }
        schedule: { type: string, description: 五字段 cron 或 @hourly 等描述符 }
        timezone: { type: string }
        kind: { type: string, enum: [push_text, run_agent] }
        input: { type: string }
        session_key: { type: string }
        missed_policy: { type: string, enum: [skip, run_once] }
        enabled: { type: boolean }
        next_run_at: { type: string, format: date-time }
        last_run_at: { type: string, format: date-time }
        last_status: { type: string, enum: [ok, failed, skipped] }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    JobInput:
      type: object
      properties:
        agent_id: { type: string }
        name: { type: string }
        schedule: { type: string }
        timezone: { type: string }
        kind: { type: string, enum: [push_text, run_agent] }
        input: { type: string }
        session_key: { type: string }
        missed_policy: { type: string, enum: [skip, run_once] }
        enabled: { type: boolean }

    ExtensionKind:
      type: string
      enum: [skill, mcp_server, plugin]

    MCPServerConfig:
      type: object
      required: [transport]
      properties:
        transport: { type: string, enum: [stdio, http] }
        command: { type: string }
        args: { type: array, items: { type: string } }
        env: { type: object, additionalProperties: { type: string }, description: 值可为 "secret:<ref>" 引用 }
        url: { type: string }
        headers: { type: object, additionalProperties: { type: string }, description: http 传输的附加请求头，值可为 "secret:<ref>" 引用 }

    ExtensionStatus:
      type: object
      description: 扩展的运行时状态（MCP 连接、工具声明是否变化）
      properties:
        id: { type: string }
        connected: { type: boolean }
        tool_count: { type: integer }
        tools_changed: { type: boolean, description: 工具声明与首次启用时固定的摘要不一致，需用户确认后才会再暴露给模型 }
        last_error: { type: string }

    Extension:
      type: object
      required: [id, kind, name, source, install_dir, enabled, installed_at, updated_at]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/ExtensionKind" }
        name: { type: string }
        version: { type: string }
        source: { type: string }
        install_dir: { type: string }
        manifest: { type: object, additionalProperties: true }
        mcp: { $ref: "#/components/schemas/MCPServerConfig" }
        enabled: { type: boolean }
        digest: { type: string }
        installed_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Channel:
      type: object
      required: [id, agent_id, kind, name, enabled, created_at, updated_at]
      properties:
        id: { type: string }
        agent_id: { type: string }
        kind: { type: string, enum: [console, telegram, feishu, dingtalk, wecom, discord] }
        name: { type: string }
        has_secret: { type: boolean }
        config:
          type: object
          additionalProperties: true
          description: 平台相关的非敏感配置，如 allowed_peers、group_mode(mention|all)、prefix
        enabled: { type: boolean }
        status: { type: string, enum: [stopped, starting, running, failed], description: 适配器运行状态 }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ChannelInput:
      type: object
      description: 创建时 `agent_id`、`kind`、`name` 必填
      properties:
        agent_id: { type: string }
        kind: { type: string, enum: [console, telegram, feishu, dingtalk, wecom, discord] }
        name: { type: string }
        secret: { type: string, writeOnly: true, description: 平台凭据（Bot Token 等），只写入 secret 存储 }
        config: { type: object, additionalProperties: true }
        enabled: { type: boolean }

    Event:
      type: object
      required: [seq, type, at]
      description: |
        事件信封。`type` 取值：`model.RunEventType` 的全部值（payload 为 RunEvent，含 `reasoning.delta`），
        `session.created` / `session.updated` / `session.deleted`（payload 为 Session）、
        `agent.created` / `agent.updated` / `agent.deleted`（payload 为 Agent；删除智能体会级联删除其会话、任务与通道，客户端应据此使相关缓存失效）、
        `provider.created` / `provider.updated` / `provider.deleted`（payload 为 Provider，不含密钥）、
        `job.triggered`（payload 为 Job）、
        `extension.installed` / `extension.updated` / `extension.removed` / `extension.tools_changed`（payload 为 Extension）、
        `project.created/updated`、`project.material.created/removed`、`draft.updated/deleted`、`artifact.created/revision.created`（仅ID、版本与来源等元数据，无正文），
        `worker.status`（payload 为 VersionInfo.worker）、`gap`（无 payload）。只增事件类型，不改既有字段语义。
      properties:
        seq: { type: integer, format: int64 }
        type: { type: string }
        at: { type: string, format: date-time }
        agent_id: { type: string }
        session_id: { type: string }
        run_id: { type: string }
        payload: { type: object, additionalProperties: true }

    Settings:
      type: object
      properties:
        timezone: { type: string, description: IANA 时区；未设置时省略，effective_timezone 给出实际生效值 }
        locale: { type: string, enum: [zh, en, fr], description: 用户显式设置的语言；未设置时省略（客户端据此按浏览器/系统语言选择） }
        effective_locale: { type: string, enum: [zh, en, fr], readOnly: true, description: 内核实际使用的语言（设置 > 系统环境 > 默认） }
        effective_timezone: { type: string, readOnly: true, description: 内核实际使用的时区 }
        allowed_origins: { type: array, items: { type: string }, description: 额外允许的 Origin（开发用） }

    AuditEntry:
      type: object
      required: [id, at, actor, action, outcome]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string }
        agent_id: { type: string }
        session_id: { type: string }
        run_id: { type: string }
        action: { type: string }
        resource: { type: string }
        outcome: { type: string }
        details: { type: object, additionalProperties: true }
