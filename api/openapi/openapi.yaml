      responses:
        "200": { description: PDF layout, content: { application/pdf: { schema: { type: string, format: binary } } } }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer

  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    AgentList:
      description: ok
      content:
        application/json:
          schema:
            type: object
            properties:
              items: { type: array, items: { $ref: "#/components/schemas/Agent" } }

  schemas:
    PreviewFileEntry:
      type: object
      required: [name, path, size, is_dir, mod_time]
      properties:
        name: { type: string }
        path: { type: string }
        size: { type: integer }
        is_dir: { type: boolean }
        mod_time: { type: string, format: date-time }
    PreviewBlock:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [paragraph, heading, table, image] }
        text: { type: string }
        level: { type: integer }
        image: { type: string, description: Validated embedded raster data URL }
        runs:
          type: array
          items:
            type: object
            required: [text]
            properties:
              text: { type: string }
              bold: { type: boolean }
              italic: { type: boolean }
        rows: { type: array, items: { type: array, items: { type: string } } }
    PreviewDocument:
      type: object
      required: [format, kind, name, size, mime, version]
      properties:
        format: { type: string }
        kind: { type: string, enum: [text, markdown, html, document, slides, sheet, archive, pdf, image, audio, video, conversion, unsupported] }
        name: { type: string }
        size: { type: integer }
        mime: { type: string }
        version: { type: string }
        text: { type: string }
        blocks: { type: array, items: { $ref: "#/components/schemas/PreviewBlock" } }
        warnings: { type: array, items: { type: string } }
        slides:
          type: array
          items:
            type: object
            required: [name, blocks]
            properties:
              name: { type: string }
              blocks: { type: array, items: { $ref: "#/components/schemas/PreviewBlock" } }
        sheets:
          type: array
          items:
            type: object
            required: [name, rows]
            properties:
              name: { type: string }
              rows: { type: array, items: { type: array, items: { type: string } } }
        entries:
          type: array
          items:
            type: object
            required: [name, size, directory]
            properties:
              name: { type: string }
              size: { type: integer }
              directory: { type: boolean }
    ChangeSet:
      type: object
      description: Metadata only; file identities, before-images and proposed text stay in protected kernel storage.
      required:
        - id
        - owner_id
        - agent_id
        - session_id
        - artifact_id
        - revision_id
        - target_path
        - preview_digest
        - base_sha256
        - proposed_sha256
        - operation
        - status
        - version
        - base_exists
        - proposed_size
        - created_at
        - expires_at
      properties:
        id:
          type: string
        owner_id:
          type: string
        agent_id:
          type: string
        session_id:
          type: string
        artifact_id:
          type: string
        revision_id:
          type: string
        target_path:
          type: string
        preview_digest:
          type: string
        base_sha256:
          type: string
        proposed_sha256:
          type: string
        operation:
          type: string
          enum:
            - create
            - replace
            - delete
        status:
          type: string
          enum:
            - prepared
            - awaiting_approval
            - applying
            - applied
            - denied
            - expired
            - conflict
            - failed
            - cancelled
            - recovery_required
        version:
          type: integer
          minimum: 1
        base_exists:
          type: boolean
        proposed_size:
          type: integer
          minimum: 0
        operation_id:
          type: string
        undo_of:
          type: string
        reason:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        applied_at:
          type: string
          format: date-time
    ChangeInput:
      type: object
      additionalProperties: false
      required:
        - artifact_id
        - revision_id
        - target_path
        - operation
      properties:
        artifact_id:
          type: string
        revision_id:
          type: string
        target_path:
          type: string
          description: Normalized workspace-relative path; no symlinks or hard links.
        operation:
          type: string
          enum:
            - create
            - replace
    ChangeApplyInput:
      type: object
      additionalProperties: false
      required:
        - expected_version
        - preview_digest
      properties:
        expected_version:
          type: integer
          minimum: 1
        preview_digest:
          type: string
    ChangeVersionInput:
      type: object
      additionalProperties: false
      required:
        - expected_version
      properties:
        expected_version:
          type: integer
          minimum: 1
    ChangeDiff:
      type: object
      required:
        - change
        - before
        - after
      properties:
        change:
          $ref: '#/components/schemas/ChangeSet'
        before:
          type: string
        after:
          type: string
    Operation:
      type: object
      description: Persistent local-user file operation; not a model run.
      properties:
        id:
          type: string
        owner_id:
          type: string
        agent_id:
          type: string
        session_id:
          type: string
        change_set_id:
          type: string
        status:
          type: string
          enum:
            - created
            - awaiting_approval
            - executing
            - completed
            - failed
            - cancelled
            - expired
            - recovery_required
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

