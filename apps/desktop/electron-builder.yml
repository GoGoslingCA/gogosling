# electron-builder 打包配置（不签名）。
#
# 运行 `npm run package -w @gogosling/desktop` 前需要：
# package 脚本会构建 Web/桌面代码，并暂存和验证本平台 Go/CPython 运行时。
# 安装后不依赖全局 Go、Node、Python 或 uv；开发时仍可单独运行源码。
appId: com.gogosling.desktop
productName: gogosling
copyright: gogosling contributors
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

directories:
  output: release
  buildResources: build

# 只打包编译产物；源码、测试与配置不进 asar。
files:
  - dist/**/*
  - package.json
  - "!**/*.map"

asar: true
npmRebuild: false
forceCodeSigning: false
beforePack: scripts/before-pack.cjs

# 预留的外部资源：守护进程二进制与工作进程运行环境必须是真实文件（不能进 asar）。
# 内置扩展放在 share/gogosling/extensions/bundled：与 internal/app/resources.go 的安装布局
# <exe>/../share/gogosling 一致（exe 在 <resources>/bin），壳拉起守护进程时也显式传 GOGOSLING_RESOURCES。
extraResources:
  - from: ../web/dist
    to: web
  - from: resources/runtime
    to: .
    filter: ["**/*"]
  - from: ../../extensions/bundled
    to: share/gogosling/extensions/bundled

# 深链 gogosling://（macOS 由 Info.plist 注册；Windows/Linux 由安装器注册）
protocols:
  - name: gogosling
    schemes: [gogosling]

mac:
  target: [dmg]
  category: public.app-category.productivity
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  sign: false

win:
  target: [nsis]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

linux:
  target: [AppImage]
  category: Utility
  synopsis: gogosling desktop shell
